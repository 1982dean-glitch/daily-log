<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>施工日誌速記</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center select-none">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-5 flex flex-col gap-4">
    <div class="flex justify-between items-center border-b pb-3">
      <h1 class="text-xl font-bold text-slate-800">🏗️ 施工日誌速記</h1>
      <span id="statusTag" class="text-xs px-2.5 py-1 bg-green-100 text-green-700 rounded-full font-medium">本機極速版</span>
    </div>

    <!-- 系統設定展開 -->
    <details class="text-xs text-slate-500 bg-slate-50 p-2.5 rounded-lg border">
      <summary class="cursor-pointer font-medium text-slate-700">⚙️ 雲端寫入網址設定</summary>
      <div class="mt-2 flex flex-col gap-2">
        <label>Google Apps Script 後端網址：
          <input id="gasUrl" type="text" class="w-full border rounded p-1.5 text-slate-800" placeholder="貼上 Apps Script exec 網址">
        </label>
        <button onclick="saveConfig()" class="bg-slate-700 text-white py-1.5 rounded font-medium">儲存設定</button>
      </div>
    </details>

    <!-- 語音輸入按鈕區 -->
    <div class="flex flex-col items-center py-3">
      <button id="micBtn" 
              onclick="handleBtnClick()"
              class="w-24 h-24 rounded-full bg-black-600 hover:bg-blue-700 active:scale-95 text-white flex flex-col items-center justify-center shadow-lg transition-all duration-200">
        <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        <span id="btnText" class="text-xs mt-1">點擊說話</span>
      </button>
      <p id="subHint" class="text-xs text-slate-400 mt-2">點一下開始說話，說完再點一下</p>
    </div>

    <!-- 辨識文字與手動修改區 -->
    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs font-semibold text-slate-600">辨識文字：</label>
        <button onclick="reParseManual()" class="text-xs text-blue-600 underline">手動修改後重解</button>
      </div>
      <textarea id="voiceText" rows="2" class="w-full border rounded-lg p-2 text-sm text-slate-800 bg-slate-50 focus:outline-none focus:bg-white" placeholder="例：永和國光昨天泥作2人門框填縫"></textarea>
    </div>

    <!-- 結構化預覽卡片（含手動調整日期與案名） -->
    <div id="parsedCard" class="border rounded-xl p-3 bg-blue-50/50 flex flex-col gap-2.5">
      <div class="flex justify-between items-center">
        <span class="text-xs font-bold text-blue-900">⚡ 本地秒級解析結果</span>
        <span id="parsedSite" class="text-xs font-bold bg-blue-200 text-blue-800 px-2 py-0.5 rounded">案名：永和國光</span>
      </div>

      <!-- 日期調整欄位 -->
      <div class="flex items-center justify-between text-xs bg-white p-2 rounded-lg border border-blue-100">
        <span class="font-semibold text-slate-700">📅 記錄日期：</span>
        <input id="logDate" type="date" class="border rounded px-2 py-1 text-slate-800 font-medium focus:outline-none focus:border-blue-500">
      </div>

      <div id="parsedDetails" class="text-xs text-slate-600 space-y-1">
        <div>• 施作工項：<span id="parsedTask" class="text-slate-800 font-medium">-</span></div>
        <div>• 出工人數：<span id="parsedWorkers" class="text-slate-800 font-medium">-</span></div>
      </div>
    </div>

    <!-- 送出按鈕 -->
    <button id="sendBtn" onclick="sendToCloud()" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-xl font-medium text-sm transition">
      確認並儲存至雲端
    </button>
  </div>

  <script>
    let recognition = null;
    let isRecording = false;
    let parsedResult = null;

    const JOBS = ["大工", "小工", "隔間", "油漆", "木工", "金屬", "泥作", "機電", "清運"];
    const CHINESE_NUMS = {
      '零': 0, '一': 1, '二': 2, '兩': 2, '三': 3, '四': 4,
      '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10,
      '半': 0.5
    };

    window.onload = () => {
      document.getElementById('gasUrl').value = localStorage.getItem('gas_backend_url') || '';
      // 預設填入今天日期
      setTargetDate(new Date());
      initSpeech();
    };

    function setTargetDate(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      document.getElementById('logDate').value = `${year}-${month}-${day}`;
    }

    function saveConfig() {
      const u = document.getElementById('gasUrl').value.trim();
      localStorage.setItem('gas_backend_url', u);
      alert('GAS 網址已儲存！');
    }

    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('警告：此瀏覽器不支援語音 API，請使用 Chrome 開啟！');
        return false;
      }
      
      try {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-TW';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
          isRecording = true;
          document.getElementById('micBtn').classList.remove('bg-blue-600', 'hover:bg-blue-700');
          document.getElementById('micBtn').classList.add('bg-red-500', 'animate-pulse');
          document.getElementById('btnText').innerText = '正在聆聽...';
          document.getElementById('subHint').innerText = '說完請再點一下按鈕';
          document.getElementById('statusTag').innerText = '聆聽中...';
        };

        recognition.onresult = (e) => {
          if (e.results && e.results[0] && e.results[0][0]) {
            const text = e.results[0][0].transcript;
            document.getElementById('voiceText').value = text;
            parseLocally(text);
          }
        };

        recognition.onerror = (e) => {
          stopRecordingUI();
          if (e.error === 'not-allowed') {
            alert('麥克風被封鎖！請至瀏覽器設定中開啟麥克風權限。');
          } else if (e.error !== 'no-speech') {
            alert('語音中斷：' + e.error);
          }
        };

        recognition.onend = () => stopRecordingUI();
        return true;
      } catch (err) {
        return false;
      }
    }

    function handleBtnClick() {
      if (!recognition) {
        const ok = initSpeech();
        if (!ok) return;
      }

      if (!isRecording) {
        try {
          recognition.start();
        } catch (err) {
          recognition.stop();
          setTimeout(() => { try { recognition.start(); } catch(e) {} }, 300);
        }
      } else {
        recognition.stop();
      }
    }

    function stopRecordingUI() {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('bg-red-500', 'animate
