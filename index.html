<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>施工日誌速記</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-5 flex flex-col gap-4">
    <div class="flex justify-between items-center border-b pb-3">
      <h1 class="text-xl font-bold text-slate-800">🏗️ 施工日誌速記</h1>
      <span id="statusTag" class="text-xs px-2.5 py-1 bg-green-100 text-green-700 rounded-full font-medium">本機極速版</span>
    </div>

    <!-- 系統設定展開 (僅需設定 GAS 網址) -->
    <details class="text-xs text-slate-500 bg-slate-50 p-2.5 rounded-lg border">
      <summary class="cursor-pointer font-medium text-slate-700">⚙️ 雲端寫入網址設定</summary>
      <div class="mt-2 flex flex-col gap-2">
        <label>Google Apps Script 後端網址：
          <input id="gasUrl" type="text" class="w-full border rounded p-1.5 text-slate-800" placeholder="貼上 Apps Script exec 網址">
        </label>
        <button onclick="saveConfig()" class="bg-slate-700 text-white py-1.5 rounded font-medium">儲存設定</button>
      </div>
    </details>

    <!-- 語音輸入按鈕區 -->
    <div class="flex flex-col items-center py-4">
      <button id="micBtn" onclick="toggleRecording()" class="w-24 h-24 rounded-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white flex flex-col items-center justify-center shadow-lg transition-all duration-200">
        <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        <span id="btnText" class="text-xs mt-1">按住說話</span>
      </button>
      <p class="text-xs text-slate-400 mt-2">點擊開始語音辨識，說完再次點擊</p>
    </div>

    <!-- 語音辨識結果與手動修改區 -->
    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs font-semibold text-slate-600">辨識文字（可手動修改）：</label>
        <button onclick="reParseManual()" class="text-xs text-blue-600 underline">重新解析</button>
      </div>
      <textarea id="voiceText" rows="2" class="w-full border rounded-lg p-2 text-sm text-slate-800 bg-slate-50 focus:outline-none focus:bg-white" placeholder="例：永和國光今天泥作2人門框填縫、木工1人貼皮收尾"></textarea>
    </div>

    <!-- 結構化預覽卡片 -->
    <div id="parsedCard" class="border rounded-xl p-3 bg-blue-50/50 flex flex-col gap-2">
      <div class="flex justify-between items-center">
        <span class="text-xs font-bold text-blue-900">⚡ 本地秒級解析結果</span>
        <span id="parsedSite" class="text-xs font-bold bg-blue-200 text-blue-800 px-2 py-0.5 rounded">案名：待解析</span>
      </div>
      <div id="parsedDetails" class="text-xs text-slate-600 space-y-1">
        <div>• 施作工項：<span id="parsedTask">-</span></div>
        <div>• 出工人數：<span id="parsedWorkers">-</span></div>
      </div>
    </div>

    <!-- 送出按鈕 -->
    <button id="sendBtn" onclick="sendToCloud()" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-xl font-medium text-sm transition">
      確認並儲存至雲端
    </button>
  </div>

  <script>
    let recognition;
    let isRecording = false;
    let parsedResult = null;

    // 支援工種清單（對齊試算表 D ~ L 欄順序）
    const JOBS = ["大工", "小工", "隔間", "油漆", "木工", "金屬", "泥作", "機電", "清運"];
    
    // 中文數字轉換字典
    const CHINESE_NUMS = {
      '零': 0, '一': 1, '二': 2, '兩': 2, '三': 3, '四': 4,
      '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10,
      '半': 0.5
    };

    window.onload = () => {
      document.getElementById('gasUrl').value = localStorage.getItem('gas_backend_url') || '';
      initSpeech();
    };

    function saveConfig() {
      const u = document.getElementById('gasUrl').value.trim();
      localStorage.setItem('gas_backend_url', u);
      alert('GAS 網址已儲存！');
    }

    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('您的瀏覽器不支援語音辨識，請使用 Chrome 開啟。');
        return;
      }
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById('voiceText').value = text;
        parseLocally(text);
      };

      recognition.onerror = () => stopRecording();
      recognition.onend = () => stopRecording();
    }

    function toggleRecording() {
      if (!isRecording) {
        try {
          recognition.start();
