<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>施工日誌速記</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f1f5f9; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; user-select: none; }
    .container { width: 100%; max-width: 448px; background: #fff; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; }
    .header h1 { font-size: 1.15rem; font-weight: 700; color: #1e293b; }
    .badge { font-size: 12px; padding: 2px 10px; background: #dcfce7; color: #15803d; border-radius: 9999px; font-weight: 600; }
    details { font-size: 12px; color: #64748b; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
    summary { cursor: pointer; font-weight: 600; color: #334155; }
    .config-body { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    input[type="text"], input[type="date"], textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 14px; color: #1e293b; background: #fff; outline: none; }
    input:focus, textarea:focus { border-color: #2563eb; }
    .btn-secondary { background: #334155; color: #fff; padding: 6px; border-radius: 6px; font-weight: 500; border: none; cursor: pointer; }
    .mic-section { display: flex; flex-direction: column; align-items: center; padding: 8px 0; }
    .mic-btn { width: 96px; height: 96px; border-radius: 50%; background: #2563eb; color: #fff; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 10px 15px -3px rgba(37,99,235,0.35); cursor: pointer; transition: all 0.2s ease; }
    .mic-btn:active { transform: scale(0.95); }
    .mic-btn.recording { background-color: #ef4444; animation: pulse 1.5s infinite; box-shadow: 0 10px 15px -3px rgba(239,68,68,0.4); }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.85; } }
    .mic-btn svg { width: 40px; height: 40px; fill: currentColor; }
    .mic-btn span { font-size: 12px; margin-top: 4px; }
    .sub-hint { font-size: 12px; color: #94a3b8; margin-top: 8px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .label-row label { font-size: 12px; font-weight: 600; color: #475569; }
    .link-btn { font-size: 12px; color: #2563eb; background: none; border: none; text-decoration: underline; cursor: pointer; }
    .preview-card { border: 1px solid #bfdbfe; background: #eff6ff; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .card-title-row { display: flex; justify-content: space-between; align-items: center; }
    .card-title-row strong { font-size: 12px; color: #1e3a8a; }
    .site-tag { font-size: 12px; font-weight: 700; background: #bfdbfe; color: #1e40af; padding: 2px 8px; border-radius: 4px; }
    .date-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; background: #fff; padding: 6px 10px; border-radius: 8px; border: 1px solid #dbeafe; }
    .date-row span { font-weight: 600; color: #334155; }
    .date-row input[type="date"] { width: auto; padding: 2px 6px; font-size: 12px; }
    .details-list { font-size: 12px; color: #475569; display: flex; flex-direction: column; gap: 4px; }
    .details-list div span { color: #0f172a; font-weight: 600; }
    .btn-submit { width: 100%; background: #1e293b; color: #fff; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background: #0f172a; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏗️ 施工日誌速記</h1>
      <span id="statusTag" class="badge">本機極速版</span>
    </div>

    <!-- 系統設定展開 -->
    <details>
      <summary>⚙️ 雲端寫入網址設定</summary>
      <div class="config-body">
        <label>Google Apps Script 後端網址：
          <input id="gasUrl" type="text" placeholder="貼上 Apps Script exec 網址">
        </label>
        <button onclick="saveConfig()" class="btn-secondary">儲存設定</button>
      </div>
    </details>

    <!-- 語音輸入按鈕區 -->
    <div class="mic-section">
      <button id="micBtn" onclick="handleBtnClick()" class="mic-btn">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        <span id="btnText">點擊說話</span>
      </button>
      <p id="subHint" class="sub-hint">點一下開始說話，說完再點一下</p>
    </div>

    <!-- 辨識文字與手動修改區 -->
    <div>
      <div class="label-row">
        <label>辨識文字（可手動修改）：</label>
        <button onclick="reParseManual()" class="link-btn">手動修改後重解</button>
      </div>
      <textarea id="voiceText" rows="2" placeholder="例：永和國光今天木工2人、水電1人、防水1人配管及防水施作"></textarea>
    </div>

    <!-- 結構化預覽卡片 -->
    <div class="preview-card">
      <div class="card-title-row">
        <strong>⚡ 本地秒級解析結果</strong>
        <span id="parsedSite" class="site-tag">案名：永和國光</span>
      </div>

      <div class="date-row">
        <span>📅 記錄日期：</span>
        <input id="logDate" type="date">
      </div>

      <div class="details-list">
        <div>• 施作工項：<span id="parsedTask">-</span></div>
        <div>• 出工人數：<span id="parsedWorkers">-</span></div>
        <div>• 備註資訊：<span id="parsedNotes">-</span></div>
      </div>
    </div>

    <!-- 送出按鈕 -->
    <button id="sendBtn" onclick="sendToCloud()" class="btn-submit">
      確認並儲存至雲端
    </button>
  </div>

  <script>
    let recognition = null;
    let isRecording = false;
    let parsedResult = null;

    // 9 大基本工項標準定義與涵蓋別名
    const STANDARD_JOBS_CONFIG = [
      { name: "大工", aliases: ["大工"] },
      { name: "小工", aliases: ["小工", "雜工"] },
      { name: "隔間", aliases: ["隔間", "輕隔間", "隔間工", "輕鋼架"] },
      { name: "油漆", aliases: ["油漆", "油漆工", "油漆師傅", "漆作", "塗裝", "油漆工班"] },
      { name: "木工", aliases: ["木工", "木作", "木工師傅", "木工工班"] },
      { name: "金屬", aliases: ["金屬", "鐵件", "鐵工", "金屬工", "鐵工師傅"] },
      { name: "泥作", aliases: ["泥作", "泥水", "泥作工", "泥作師傅", "泥工", "泥水工"] },
      { name: "機電", aliases: ["機電", "水電", "水電工", "水電師傅", "電工", "水電工班"] },
      { name: "清運", aliases: ["清運", "清潔", "垃圾車", "廢料清運", "清運車"] }
    ];

    // 全域基本工項黑名單：確保「其他」絕不納入任何基本工種
    const ALL_STANDARD_KEYWORDS = STANDARD_JOBS_CONFIG.flatMap(j => [j.name, ...j.aliases]);

    const CHINESE_NUMS = {
      '零': 0, '一': 1, '二': 2, '兩': 2, '三': 3, '四': 4,
      '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10,
      '半': 0.5
    };

    window.onload = () => {
      document.getElementById('gasUrl').value = localStorage.getItem('gas_backend_url') || '';
      setTargetDate(new Date());
      initSpeech();
    };

    function setTargetDate(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      document.getElementById('logDate').value = `${year}-${month}-${day}`;
    }

    function saveConfig() {
      const u = document.getElementById('gasUrl').value.trim();
      localStorage.setItem('gas_backend_url', u);
      alert('GAS 網址已儲存！');
    }

    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('此瀏覽器不支援語音辨識 API，請使用 Chrome 開啟！');
        return false;
      }
      
      try {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-TW';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
          isRecording = true;
          document.getElementById('micBtn').classList.add('recording');
          document.getElementById('btnText').innerText = '正在聆聽...';
          document.getElementById('subHint').innerText = '說完請再點一下按鈕';
          document.getElementById('statusTag').innerText = '聆聽中...';
        };

        recognition.onresult = (e) => {
          if (e.results && e.results[0] && e.results[0][0]) {
            const text = e.results[0][0].transcript;
            document.getElementById('voiceText').value = text;
            parseLocally(text);
          }
        };

        recognition.onerror = (e) => {
          stopRecordingUI();
          if (e.error === 'not-allowed') {
            alert('麥克風被封鎖！請開啟麥克風權限。');
          } else if (e.error !== 'no-speech') {
            alert('語音中斷：' + e.error);
          }
        };

        recognition.onend = () => stopRecordingUI();
        return true;
      } catch (err) {
        return false;
      }
    }

    function handleBtnClick() {
      if (!recognition) {
        const ok = initSpeech();
        if (!ok) return;
      }

      if (!isRecording) {
        try {
          recognition.start();
        } catch (err) {
          recognition.stop();
          setTimeout(() => { try { recognition.start(); } catch(e) {} }, 300);
        }
      } else {
        recognition.stop();
      }
    }

    function stopRecordingUI() {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('btnText').innerText = '點擊說話';
      document.getElementById('subHint').innerText = '點一下開始說話，說完再點一下';
      if (document.getElementById('statusTag').innerText === '聆聽中...') {
        document.getElementById('statusTag').innerText = '本機極速版';
      }
    }

    function reParseManual() {
      const text = document.getElementById('voiceText').value.trim();
      if (text) parseLocally(text);
    }

    // 嚴格兩階段解析：基本工項歸位 + 非基本工項分流
    function parseLocally(speechText) {
      document.getElementById('statusTag').innerText = '解析完成';

      // 1. 日期智能判定
      let targetDate = new Date();
      if (speechText.includes("昨天") || speechText.includes("昨日")) {
        targetDate.setDate(targetDate.getDate() - 1);
      } else if (speechText.includes("前天") || speechText.includes("前日")) {
        targetDate.setDate(targetDate.getDate() - 2);
      } else {
        const dateMatch = speechText.match(/(\d{1,2})[月\/](\d{1,2})[號日]?/);
        if (dateMatch) {
          const m = parseInt(dateMatch[1], 10) - 1;
          const d = parseInt(dateMatch[2], 10);
          targetDate.setMonth(m, d);
        }
      }
      setTargetDate(targetDate);

      // 2. 案名判定
      let detectedSite = "永和國光";
      if (speechText.includes("板橋")) {
        detectedSite = "板橋電銷";
      } else if (speechText.includes("永和") || speechText.includes("國光")) {
        detectedSite = "永和國光";
      } else if (speechText.includes("三重") || speechText.includes("捷運")) {
        detectedSite = "三重捷運路";
      }

      let remainingText = speechText;

      // 3. 第一階段：優先提取 9 大基本工項（鎖定 D~L 專屬欄位）
      let workers = {};
      STANDARD_JOBS_CONFIG.forEach(job => {
        workers[job.name] = 0;
        const aliasPattern = job.aliases.join('|');
        const regex = new RegExp(`(?:${aliasPattern})\\s*([0-9]+(?:\\.[0-9]+)?|[一二兩三四五六七八九十半])\\s*(?:人|個|位|車)?`, 'i');
        const match = remainingText.match(regex);
        if (match) {
          const rawNum = match[1];
          const count = CHINESE_NUMS[rawNum] !== undefined ? CHINESE_NUMS[rawNum] : (parseFloat(rawNum) || 0);
          workers[job.name] = count;
          // 自文字中抹除已歸類的標準工項
          remainingText = remainingText.replace(match[0], ' ');
        }
      });

      // 4. 第二階段：提取真正的新工項（黑名單嚴格過濾）
      let otherWorkers = 0;
      let otherDetails = [];
      const customJobPattern = /([\u4e00-\u9fa5]{2,4})\s*([0-9]+(?:\.[0-9]+)?|[一二兩三四五六七八九十半])\s*(?:人|個|位|車)?/g;
      let customMatch;

      while ((customMatch = customJobPattern.exec(remainingText)) !== null) {
        const jobName = customMatch[1];
        const rawNum = customMatch[2];
        const count = CHINESE_NUMS[rawNum] !== undefined ? CHINESE_NUMS[rawNum] : (parseFloat(rawNum) || 0);

        // 規則 A：包含任何 9 大基本工項字眼，絕對不計入「其他」
        const isStandardJob = ALL_STANDARD_KEYWORDS.some(kw => jobName.includes(kw) || kw.includes(jobName));
        if (isStandardJob) {
          remainingText = remainingText.replace(customMatch[0], ' ');
          continue;
        }

        // 規則 B：排除非工種常用詞
        if (["今天", "昨天", "昨日", "前天", "工程", "現場", "施作", "案場", "工地", "合計", "總共"].includes(jobName)) {
          continue;
        }

        otherWorkers += count;
        otherDetails.push(`${jobName}: ${count}人`);
        remainingText = remainingText.replace(customMatch[0], ' ');
      }

      // 5. 提取施作內容（工項乾淨化）
      let cleanTask = remainingText
        .replace(/(永和國光|板橋電銷|三重捷運路|永和案|板橋案|案場|工地)/g, '')
        .replace(/(今天|本日|昨日|昨天|前天|前日|\d{1,2}[月\/]\d{1,2}[號日]?)/g, '')
        .replace(/[，,。、\s]+/g, ' ')
        .trim();

      parsedResult = {
        site: detectedSite,
        date: document.getElementById('logDate').value,
        workers: workers,
        otherWorkers: otherWorkers,
        otherDetails: otherDetails.join('、'),
        mainTask: cleanTask || "現場施作",
        subTask: "",
        notes: otherDetails.length ? `[其他工班] ${otherDetails.join('、')}` : ""
      };

      // 6. 更新介面
      document.getElementById('parsedSite').innerText = '案名：' + parsedResult.site;
      document.getElementById('parsedTask').innerText = parsedResult.mainTask;

      let workerList = [];
      for (const [job, count] of Object.entries(parsedResult.workers)) {
        if (count > 0) workerList.push(`${job}: ${count}人`);
      }
      if (otherWorkers > 0) {
        workerList.push(`其他: ${otherWorkers}人 (${otherDetails.join('、')})`);
      }
      document.getElementById('parsedWorkers').innerText = workerList.length ? workerList.join('、') : '無出工';
      document.getElementById('parsedNotes').innerText = parsedResult.notes || '無';
    }

    async function sendToCloud() {
      const gasUrl = (localStorage.getItem('gas_backend_url') || '').trim();
      if (!gasUrl) {
        alert('請先在設定中填入 GAS 網址！');
        return;
      }
      if (!parsedResult) {
        alert('尚未有解析資料，請先錄音或手動輸入！');
        return;
      }

      parsedResult.date = document.getElementById('logDate').value;
      document.getElementById('sendBtn').innerText = '正在存入試算表...';
      document.getElementById('sendBtn').disabled = true;

      try {
        const res = await fetch(gasUrl, {
          method: 'POST',
          body: JSON.stringify(parsedResult)
        });
        const resp = await res.json();
        alert(resp.message || '已成功儲存至 Google 試算表！');
        
        document.getElementById('voiceText').value = '';
        parsedResult = null;
        document.getElementById('parsedTask').innerText = '-';
        document.getElementById('parsedWorkers').innerText = '-';
        document.getElementById('parsedNotes').innerText = '-';
        document.getElementById('statusTag').innerText = '本機極速版';
        setTargetDate(new Date());
      } catch (e) {
        alert('已送出請求！請檢查試算表對應日期是否已更新。');
      } finally {
        document.getElementById('sendBtn').innerText = '確認並儲存至雲端';
        document.getElementById('sendBtn').disabled = false;
      }
    }
  </script>
</body>
</html>
